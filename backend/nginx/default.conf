server {
    listen 80;

    # Route program & inquiry REST APIs to Node.js Express Microservice
    location /api/programs {
        proxy_pass http://node-service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header "Access-Control-Allow-Origin" "*" always;
        add_header "Access-Control-Allow-Methods" "POST, GET, OPTIONS" always;
        add_header "Access-Control-Allow-Headers" "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /api/inquiries {
        proxy_pass http://node-service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header "Access-Control-Allow-Origin" "*" always;
        add_header "Access-Control-Allow-Methods" "POST, GET, OPTIONS" always;
        add_header "Access-Control-Allow-Headers" "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Route AI Chatbot requests to Python FastAPI Microservice
    location /api/chat {
        limit_req zone=chat_limit burst=3 nodelay;
        proxy_pass http://python-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        add_header "Access-Control-Allow-Origin" "*" always;
        add_header "Access-Control-Allow-Methods" "POST, GET, OPTIONS" always;
        add_header "Access-Control-Allow-Headers" "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}

limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/m;